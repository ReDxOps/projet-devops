apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todolist-api-routes
  namespace: todolist
spec:
  parentRefs:
  - name: main-gateway
    namespace: envoy-gateway-api
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: todolist-backend
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: todolist-frontend
      port: 80